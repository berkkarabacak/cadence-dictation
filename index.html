<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Cadence — Talk. It writes.
    </title>
    <meta name="description" content="Talk. Cadence writes the polished version. Free to start.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,520&family=Outfit:wght@300;400;500;560;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="sell">
    <header class="nav" id="nav">
      <div class="nav-inner">
        <a class="brand" href="index.html" aria-label="Cadence home">
          <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M6 16c2.4-4.8 4.8-4.8 7.2 0s4.8 4.8 7.2 0 4.8-4.8 7.2 0" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            </path>
          </svg>
          Cadence
        </a>
        <div class="nav-cta">
          <a class="btn btn-ink btn-sm" href="app.html">
            Talk
          </a>
        </div>
      </div>
    </header>
    <main>
      <section class="hero sell-hero">
        <div class="wrap sell-pitch">
          <h1 class="display reveal">
            Talk. It writes.
          </h1>
          <div class="hero-actions reveal reveal-2">
            <a class="btn btn-ink btn-lg" href="app.html">
              Hold to talk
            </a>
          </div>
          <p class="sell-fine reveal reveal-3">
            Free · $12/mo to skip reminders
          </p>
        </div>
        <div class="wrap-wide sell-stage-wrap">
          <div class="stage sell-stage" aria-live="polite">
            <div class="stage-grid">
              <div class="stage-col">
                <div class="stage-label">
                  Spoken
                </div>
                <div id="hero-raw" class="stage-text is-raw">
                </div>
              </div>
              <div class="stage-col">
                <div class="stage-label">
                  Sent
                </div>
                <div id="hero-clean" class="stage-text is-clean">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="platforms sell-platforms" aria-label="Platforms">
          <span class="chip">
            Mac
          </span>
          <span class="chip">
            Win
          </span>
          <span class="chip">
            iPhone
          </span>
          <span class="chip">
            Android
          </span>
        </div>
      </section>
      <section class="sell-steps">
        <div class="wrap sell-tiles">
          <article class="sell-tile">
            <span class="sell-ico" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="1.8">
                </circle>
                <circle cx="16" cy="16" r="4" fill="currentColor">
                </circle>
              </svg>
            </span>
            <h2>
              Hold
            </h2>
          </article>
          <article class="sell-tile">
            <span class="sell-ico" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M8 16v4M12 11v14M16 8v20M20 13v10M24 16v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                </path>
              </svg>
            </span>
            <h2>
              Speak
            </h2>
          </article>
          <article class="sell-tile">
            <span class="sell-ico" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none">
                <path d="M6 16h18M17 9l7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                </path>
              </svg>
            </span>
            <h2>
              Send
            </h2>
          </article>
        </div>
      </section>
      <section class="sell-price">
        <div class="wrap">
          <p class="sell-dollar">
            $12
          </p>
          <a class="btn btn-ink btn-lg" href="checkout.html">
            Get Pro
          </a>
          <p class="sell-or">
            <a href="app.html">
              or just talk free
            </a>
          </p>
        </div>
      </section>
    </main>
    <footer class="footer sell-footer">
      <div class="wrap">
        <nav>
          <a href="index.html">
            Cadence
          </a>
          <a href="app.html">
            App
          </a>
          <a href="privacy.html">
            Privacy
          </a>
        </nav>
      </div>
    </footer>
    <script src="site.js">
    </script>
  </body>
</html>
